# Parameters for already available areas
_arg:
  peril: ${runtime_params:peril, 'Cold spell'}
  start_year: ${runtime_params:start_year, 1996}
params_s:
  exclude: #{}
    AdminLvl1: ['Isla De Pascua', 'Tierra Del Fuego', 'Antártica Chilena', 'Magallanes', 'Ultima Esperanza', 'Zona Sin Demarcar', 'Capitán Prat', 'Valparaíso']
params_process:
  offset: 0 #273.15
  climatology_smooth_window: 7
  func: 'quantile'
  quantiles: [0.05]
  side: 'lower'
  threshold: 4
  pixel_window: 3
  num_periods: 3

params_summarize:
  add_abs_anom: false #true


# Parameters for creating triggers
params_indices:
  dist: 'gamma'
params_series:
  cum_variable: intensity_cold_spell  # required, column used for the cumulated index (bottom panel)
  clim_variable: tmin_p05 # required, climatology column plotted in top panel
  start_time: 2020-01-01            # optional, default: None (no lower x-limit clip)
  title: Coldspell index construction  # optional, default: None (no suptitle)

params_intensity:
  variable: intensity_cold_spell # required, name of the 0/1 event variable in ds
  start_year: 2016                 # optional, drops years before this one
