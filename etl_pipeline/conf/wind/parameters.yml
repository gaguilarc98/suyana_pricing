# Parameters for already available areas
_arg:
  peril: ${runtime_params:peril, 'Strong wind'}
  start_year: ${runtime_params:start_year, 1996}
params_process:
  na_replace:
  offset: 0
  time_smooth_window: 5
  climatology_smooth_window: 7
  func: 'quantile'
  quantiles: [0.95]
  umbral: 1
  side: 'upper'
  threshold: 50
  pixel_window: 3
  num_periods: 3

params_summarize:
  add_abs_anom: false #true

# Parameters for creating triggers
params_indices:
  dist: 'gamma'
params_series:
  cum_variable: intensity_strong_wind  # required, column used for the cumulated index (bottom panel)
  clim_variable: margin_windgust # required, climatology column plotted in top panel
  start_time: 2020-01-01            # optional, default: None (no lower x-limit clip)
  title: Strong wind index construction  # optional, default: None (no suptitle)

params_intensity:
  variable: intensity_strong_wind # required, name of the 0/1 event variable in ds
  start_year: 2016                 # optional, drops years before this one
  period_start: "08-01"             # optional, "MM-DD"; must be paired with period_end
  period_end: "12-31"                # optional, "MM-DD"; must be paired with period_start

