# Parameters for already available areas
_arg:
  country: ${runtime_params:country, ${globals:country}}
  region: ${runtime_params:region, ${globals:region}}
  lead_id: ${runtime_params:lead_id, 'test1'}
  loc_id: ${runtime_params:loc_id, 'ID-001'}
  provider: ${runtime_params:provider, ${globals:provider}}
  field: ${runtime_params:field, ${globals:field}}
  start_year: ${runtime_params:start_year, 1996}
  end_year: ${runtime_params:end_year, 2025}

# ERA5
# Parameters for aoi bounding box
params_s:
  include: {
    'aoa': ['Selected'], 
    'municipio': ['Mizque','Quillacollo', 'Colomi', 'Tarija', 'Yapacani', 'Puerto Villarroel', 'Chimoré']
  }
  exclude: {}
  simplify: true
  override_gdf: false
  minx: -81.74
  maxx: -66.85
  miny: -4.23
  maxy: 13.39

# Parameters for time slice
params_t:
  start_year: ${_arg.start_year}
  end_year: ${_arg.end_year}

# Parameters for data retrieval from ERA5
params_request:
  country: ${_arg.country}
  lead_id: ${_arg.lead_id}
  provider: ${_arg.provider}
  field: ${_arg.field}
  data_path: ${globals:data_path}
      

# Parameters for processing downloaded data
params_process:
  variable: ${_arg.field}
  na_replace: null
  time_window:
    - '2006-01-01'
    - '2025-12-31'
  interp_resolution: 0
  time_smooth_window: 0
  climatology_smooth_window: 0
  summarize_mode: 'within' #'nearest' #'within'
  add_neg_anom: false #true
  threshold: -1.5
  num_days: 2
  side: 'lower'
  
# Parameters for creating indices
params_indices:
  variable: 'anom_swc' #'prcp'
  group_cols: ['location_id']
  dist: 't' #'gamma'
  start_time: '1996-01-01'
  windows: 
    1: ['06-01', '12-31'] #['05-20', '09-30']   # main growing season
    #2: ['08-01', '01-31']   # second season (crosses year-end)

params_contract:
  # Shared pricing defaults (override per crop or tail if needed)
  target_loss_ratio: 0.74 #0.65
  deductions: 0.175 #0.10
  # Uniform fallbacks -- used when not set at crop or tail level
  coverage: 1 #0.14
  insured_value: 300 #7_200_000
  crops: 
    all: 
      # Monitors both deficit in lower and excess in upper
      windows: 
          1:
            lower: 
              # Deficit rainfall: continuous ramp from p10 to p1
              'design': 'layered' #'continuous'
              'levels': {20: 0.30, 10: 0.4, 5: 0.5} #[10, 1]
              # inherits coverage=0.14, insured_value=7_200_000 from top level
            #upper: 
            #  design: 'continuous'
            #  levels: [90, 99]

# Parameters for boostrap analysis
params_bootstrap:
  n_iterations: 1000
  seed: 42
  loss_usd: 1

params_quote:
  loading_factor: 1.5  # Multiplier applied to AAL or AAL + std_dev
  margin: 0.20


# Viz parameters
params_map:
  window: 1
  crop: all
  tail: lower
  season_name: Winter season # custom
  start_year: 2003   # optional

params_series:
  id_location:   ID-081-00
  id_name:       ID-081-00
  window:        1
  crop:          all
  tail:          lower
  season_name:   Winter season
  start_time:    2003-01-01
  variable:      ${_arg.field}
  clim_variable: clim_swc
  anom_variable: anom_swc
  cum_variable:  anom_swc

