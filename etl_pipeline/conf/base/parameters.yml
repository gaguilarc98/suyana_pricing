# Parameters for already available areas
_arg:
  country: ${runtime_params:country, ${globals:country}}
  region: ${runtime_params:region, ${globals:region}}
  lead_id: ${runtime_params:lead_id, 'test1'}
  provider: ${runtime_params:provider, ${globals:provider}}
  field: ${runtime_params:field, ${globals:field}}
  peril: ${runtime_params:peril, 'Moisture deficit'}
  start_year: ${runtime_params:start_year, 2006}
  end_year: ${runtime_params:end_year, 2025}
  start_indices_at: ${runtime_params:start_indices_at, '2010-01-01'}
  target_loss_ratio: ${runtime_params:target_loss_ratio, 0.74}
  target_pure_premium: ${runtime_params:target_loss_ratio, 0.02}
  markup: ${runtime_params:markup, 0.175}

# Parameters for aoi bounding box
params_s:
  include: {}
    #AdminLvl1: ['Buenos Aires']
  exclude: #{}
    AdminLvl1: ['Tierra Del Fuego', 'Chubut', 'Santa Cruz']
  simplify: false #true
  override_gdf: false
  minx: -81.74
  maxx: -66.85
  miny: -4.23
  maxy: 13.39

# Parameters for time slice (ERA5 pipeline)
params_t:
  start_year: ${_arg.start_year}
  end_year: ${_arg.end_year}

# Parameters for data retrieval
params_request:
  country: ${_arg.country}
  lead_id: ${_arg.lead_id}
  provider: ${_arg.provider}
  field: ${_arg.field}
  peril: ${_arg.peril}
  data_path: ${globals:data_path}

# Parameters for processing Planet data
