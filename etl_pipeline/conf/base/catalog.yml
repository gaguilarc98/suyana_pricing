# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog
# Here you can define all your datasets by using simple YAML syntax.

# Arguments
# Use snake_case style for uniformity e.g. costa_rica, 'swiss_re', 'bisa_seguros'
_arg:
  country: ${runtime_params:country, ${globals:country}}
  region: ${runtime_params:region, ${globals:region}}
  lead_id: ${runtime_params:lead_id, 'test1'}
  provider: ${runtime_params:provider, ${globals:provider}}
  field: ${runtime_params:field, ${globals:field}}
  version: ${runtime_params:version, ${globals:version}}

# Geometry Data
gdf_country:
  type: geopandas.GenericDataset
  filepath: ${globals:data_path}/geometries/${_arg.country}_total_polygons.parquet #${globals:data_path}
  file_format: parquet
  save_args:
    compression: GZIP

gdf_request:
  type: geopandas.GenericDataset
  filepath: ${globals:data_path}/geometries/${_arg.country}_registered_geometries.parquet
  file_format: parquet
  save_args:
    compression: GZIP

gdf_aoi:
  type: geopandas.GenericDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/geometries/location_geometries.parquet #gdf_aoi.parquet
  file_format: parquet
  save_args:
    compression: GZIP

dict_bounds:
  type: json.JSONDataset  # Note: Use JSONDataSet from kedro_datasets
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/bounding_box.json

# Request data
ds_request:
  type: pricing_automation.datasets_registry.ZarrPartitionedDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/sources/${_arg.provider}_${_arg.field}_<partition>.zarr
  save_args:
    consolidated: true
    mode: w
    zarr_format: 2
  load_args:
    combine: by_coords
    parallel: true
    drop_variables: ['expver', 'number']

# Index Data
ds_processed:
  type: pricing_automation.datasets_registry.XarrayZarrDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/features/${_arg.provider}_${_arg.field}_anomalies.zarr #${_arg.version}.zarr
  save_args:
    consolidated: true
    mode: w
    zarr_format: 2
    append_dim: time
    chunks: {'time': -1, 'lat': 40, 'lon': 40}
    safe_chunks: false
  load_args:
    consolidated: true

ds_climatology:
  type: pricing_automation.datasets_registry.XarrayZarrDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/features/${_arg.provider}_${_arg.field}_climatology.zarr
  save_args:
    consolidated: true
    mode: w
    append_dim: location_id
  load_args:
    consolidated: true

# Summarized Data
data_lead_specs:
  type: geopandas.GenericDataset
  #type: pandas.ParquetDataset
  filepath: data/inputs/${_arg.lead_id}_specs.parquet 
  file_format: parquet #Important if not provided kedro will attempt to use GDAL which does not support S3 natively
  save_args:
    compression: GZIP

gdf_locations:
  type: geopandas.GenericDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/geometries/${_arg.lead_id}_location_properties.parquet 
  file_format: parquet #Important if not provided kedro will attempt to use GDAL which does not support S3 natively
  save_args:
    compression: GZIP

df_pixels:
  type: pandas.ParquetDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/features/${_arg.lead_id}/${_arg.provider}_${_arg.field}_pixel_assignment.parquet
  #type: pricing_automation.datasets_registry.DeltaLakeDataset
  #filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/features/${_arg.lead_id}/${_arg.provider}_${_arg.field}_pixel_assignment
  #save_args:
  #  mode: append

df_cluster: 
  #type: pandas.ParquetDataset
  #filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/outputs/${_arg.lead_id}/${_arg.provider}_${_arg.field}_daily_indices.parquet 
  #save_args:
  #  compression: GZIP
  type: pricing_automation.datasets_registry.DeltaLakeDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/outputs/${_arg.lead_id}/${_arg.provider}_${_arg.field}_daily_indices
  save_args:
    mode: overwrite
    schema_mode: overwrite
    
# Indices Data by Window
df_indices: 
  type: pandas.ParquetDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/outputs/${_arg.lead_id}/${_arg.provider}_${_arg.field}_window_indices.parquet
  save_args:
    compression: GZIP

pkl_fit: 
  type: pickle.PickleDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/outputs/${_arg.lead_id}/${_arg.provider}_${_arg.field}_model_fit.pkl
  backend: pickle

# Payouts and Policy Data by Window
df_payouts:
  type: pandas.ParquetDataset
  filepath: ${globals:data_path}/${_arg.country}/${_arg.region}/outputs/${_arg.lead_id}/${_arg.provider}_${_arg.field}_payouts.parquet
  save_args:
    compression: GZIP

